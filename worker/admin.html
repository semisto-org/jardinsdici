<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Admin · Aux Jardins d’ici</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  :root {
    --paper: #f6f0e1; --paper-deep: #ece2cb; --card: #fffaf0; --ink: #1d3a2a; --ink-soft: #4b5f50;
    --moss: #3b6126; --leaf: #93b83a; --apple: #b3391f; --sun: #efb42c; --line: #d9ccae;
    --font: "Figtree Variable", "Trebuchet MS", system-ui, sans-serif; --display: "Young Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--font); display: grid; grid-template-columns: 320px 1fr; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--moss); }
  aside { border-right: 1px solid var(--line); background: var(--paper-deep); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 1.1rem 1.2rem .6rem; font-family: var(--display); font-size: 1.25rem; }
  .brand em { font-style: normal; color: var(--apple); }
  .me { padding: 0 1.2rem .8rem; font-size: .85rem; color: var(--ink-soft); }
  .new { margin: 0 1rem 1rem; padding: .75rem 1rem; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 650; }
  .new:hover { background: var(--apple); }
  .list { overflow-y: auto; padding: 0 .6rem 1rem; flex: 1; }
  .group { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 1rem .6rem .4rem; }
  .conv { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: .65rem .7rem; border-radius: 10px; color: var(--ink); }
  .conv:hover { background: var(--card); }
  .conv.active { background: var(--card); box-shadow: inset 3px 0 0 var(--apple); }
  .conv b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv small { color: var(--ink-soft); font-size: .8rem; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 700; margin-left: .3rem; vertical-align: 1px; }
  .b-ouverte { background: #e8ecdc; color: var(--ink); } .b-apercu { background: var(--sun); color: var(--ink); }
  .b-publiee { background: var(--moss); color: #fff; } .b-abandonnee { background: #ddd; color: #555; } .b-busy { background: var(--apple); color: #fff; }
  main { display: flex; flex-direction: column; min-height: 0; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .9rem 1.4rem; border-bottom: 1px solid var(--line); background: var(--card); }
  header.bar h1 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; margin: 0; flex: 1; min-width: 12rem; }
  .btn { border: 0; border-radius: 999px; padding: .5rem 1rem; font-weight: 650; background: var(--ink); color: var(--paper); text-decoration: none; display: inline-block; }
  .btn.go { background: var(--moss); color: #fff; } .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .thread { flex: 1; overflow-y: auto; padding: 1.5rem 1.4rem 2rem; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .msg { max-width: 88%; padding: .8rem 1rem; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
  .msg.user a { color: var(--sun); }
  .msg.assistant { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; box-shadow: 0 1px 0 rgb(29 58 42 / .08); }
  .who { font-size: .75rem; opacity: .75; margin-bottom: .2rem; }
  .msg img { max-width: 220px; border-radius: 10px; display: block; margin-top: .5rem; }
  .chip { align-self: flex-start; font-size: .85rem; background: #e8ecdc; border-radius: 999px; padding: .25rem .8rem; color: var(--ink-soft); }
  .chip.err { background: #f6dcd4; color: var(--apple); }
  .preview { align-self: stretch; background: #fff7dc; border: 2px dashed var(--sun); border-radius: 14px; padding: .9rem 1.1rem; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; }
  .empty { text-align: center; color: var(--ink-soft); margin-top: 18vh; }
  .empty h2 { font-family: var(--display); font-weight: 400; color: var(--ink); font-size: 1.8rem; }
  .ideas { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 1.2rem; }
  .ideas button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .45rem .9rem; color: var(--ink); }
  form.composer { border-top: 1px solid var(--line); background: var(--card); padding: .9rem 1.4rem 1.1rem; }
  .composer .row { max-width: 760px; margin: 0 auto; display: flex; gap: .6rem; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 3rem; max-height: 12rem; padding: .75rem .9rem; border: 2px solid var(--line); border-radius: 14px; font: inherit; background: #fff; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--moss); }
  .photo { border: 2px solid var(--line); background: #fff; border-radius: 14px; width: 3rem; height: 3rem; font-size: 1.3rem; }
  .pending { max-width: 760px; margin: 0 auto .5rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  .pending span { display: flex; align-items: center; gap: .3rem; background: #e8ecdc; border-radius: 999px; padding: .2rem .7rem; font-size: .85rem; }
  .typing { align-self: flex-start; color: var(--ink-soft); font-style: italic; }
  .menu { display: none; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgb(0 0 0 / .2); }
    body.side aside { transform: none; }
    .menu { display: inline-block; }
    .msg { max-width: 95%; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">Aux Jardins <em>d’ici</em> · admin</div>
  <div class="me" id="me"></div>
  <button class="new" id="new">＋ Nouvelle conversation</button>
  <div class="list" id="list"></div>
</aside>
<main>
  <header class="bar">
    <button class="btn ghost menu" id="menu" aria-label="Conversations">☰</button>
    <h1 id="title">Bienvenue</h1>
    <span id="actions"></span>
  </header>
  <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
  <form class="composer" id="composer">
    <div class="pending" id="pending"></div>
    <div class="row">
      <button type="button" class="photo" id="photoBtn" title="Ajouter une photo" aria-label="Ajouter une photo">📷</button>
      <input type="file" id="photo" accept="image/*" multiple hidden />
      <textarea id="text" rows="1" placeholder="Que voulez-vous changer sur le site ?" aria-label="Votre message"></textarea>
      <button class="btn" id="send" type="submit">Envoyer</button>
    </div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { me: null, convs: [], current: null, conv: null, busy: false, pending: [], polling: false };
const STATUS = { ouverte: "En cours", apercu: "Aperçu prêt", publiee: "En ligne", abandonnee: "Abandonnée" };
const NAMES = {};
const api = async (path, opts = {}) => {
  const res = await fetch(`/api/admin/${path}`, { ...opts, headers: { "X-Admin-Request": "1", ...(opts.body && !(opts.body instanceof Blob) ? { "Content-Type": "application/json" } : {}), ...opts.headers } });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Erreur ${res.status}`);
  return res.json();
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
const nameOf = (email) => email ? NAMES[email] || email.split("@")[0] : "";
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "à l’instant" : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : new Date(t).toLocaleDateString("fr-BE", { day: "numeric", month: "short" }); };
const PHOTO = /\[Photo jointe, déjà ajoutée au site : (src\/assets\/images\/[a-z0-9-]+\.jpg)\]/g;

async function loadList() {
  state.convs = await api("conversations");
  const isOpen = (c) => c.status === "ouverte" || c.status === "apercu";
  const item = (c) => `<button class="conv ${c.id === state.current ? "active" : ""}" data-id="${esc(c.id)}"><b>${esc(c.title)}</b><small>${esc(nameOf(c.author))} · ${ago(c.updated_at)}</small>${c.busy ? '<span class="badge b-busy">en cours…</span>' : `<span class="badge b-${esc(c.status)}">${STATUS[c.status] || ""}</span>`}</button>`;
  const open = state.convs.filter(isOpen), done = state.convs.filter((c) => !isOpen(c));
  $("list").innerHTML = (open.length ? `<div class="group">En cours</div>${open.map(item).join("")}` : "") + (done.length ? `<div class="group">Terminées</div>${done.map(item).join("")}` : "") || '<p class="group">Aucune conversation pour l’instant.</p>';
  for (const b of $("list").querySelectorAll(".conv")) b.onclick = () => { document.body.classList.remove("side"); openConv(b.dataset.id); };
}

function blockHtml(m, b) {
  if (b.type !== "text") return "";
  if (m.role === "user") {
    const photos = [...b.text.matchAll(PHOTO)].map((x) => `<img src="/api/admin/conversations/${encodeURIComponent(state.current)}/image?path=${encodeURIComponent(x[1])}" alt="Photo jointe" loading="lazy" />`).join("");
    const text = b.text.replace(/^\[[^\]\n]+\]\n?/, "").replace(PHOTO, "").trim();
    return (text ? rich(text) : "") + photos;
  }
  return b.text.trim() ? rich(b.text) : "";
}

function actionsHtml(conv) {
  if (state.busy) return '<span class="badge b-busy">L’assistant travaille…</span>';
  return [
    conv.preview_url ? `<a class="btn ghost" href="${esc(conv.preview_url)}" target="_blank" rel="noopener">Voir l’aperçu ↗</a>` : "",
    conv.status === "apercu" ? '<button class="btn go" data-publish>Publier</button>' : "",
    conv.status === "publiee" ? `<span class="badge b-publiee" id="deploy">En ligne</span>` : "",
    conv.status === "ouverte" || conv.status === "apercu" ? '<button class="btn ghost" data-archive title="Abandonner ces modifications">Abandonner</button>' : "",
  ].join(" ");
}

function render() {
  const inner = $("inner");
  const c = state.conv;
  if (!c) {
    $("title").textContent = "Bienvenue";
    $("actions").innerHTML = "";
    inner.innerHTML = `<div class="empty"><h2>Bonjour ${esc(state.me?.name || "")} 🌱</h2><p>Dites simplement ce que vous voulez changer sur le site. L’assistant s’occupe du reste, vous montre un aperçu, et publie quand vous le lui demandez.</p><div class="ideas">${["Ajoute un événement à l’agenda", "Corrige un texte sur une page", "Remplace une photo", "Mets à jour les chiffres de l’accueil"].map((i) => `<button type="button">${i}</button>`).join("")}</div></div>`;
    for (const b of inner.querySelectorAll(".ideas button")) b.onclick = () => { $("text").value = b.textContent + " : "; $("text").focus(); };
    setComposer(true);
    return;
  }
  const conv = c.conversation;
  $("title").textContent = conv.title;
  $("actions").innerHTML = actionsHtml(conv);
  let html = "";
  for (const m of c.messages) {
    const parts = m.content.map((b) => blockHtml(m, b)).filter(Boolean).join("");
    if (parts) html += `<div class="msg ${m.role}">${m.role === "user" && m.author ? `<div class="who">${esc(nameOf(m.author))}</div>` : ""}${parts}</div>`;
    for (const b of m.content) if (b.type === "tool_use" && (b.input?.summary || b.name === "publish")) html += `<div class="chip">${esc(b.name === "publish" ? "🚀 Mise en ligne" : "✏️ " + b.input.summary)}</div>`;
  }
  if (!state.busy && conv.status === "apercu" && conv.preview_url) html += `<div class="preview"><span>👀 Les modifications sont prêtes à être vérifiées.</span><span><a class="btn ghost" href="${esc(conv.preview_url)}" target="_blank" rel="noopener">Ouvrir l’aperçu</a> <button class="btn go" data-publish>Publier</button></span></div>`;
  inner.innerHTML = html || '<div class="empty"><p>Écrivez votre demande ci-dessous.</p></div>';
  for (const b of document.querySelectorAll("[data-publish]")) b.onclick = publish;
  for (const b of document.querySelectorAll("[data-archive]")) b.onclick = archive;
  setComposer(conv.status === "ouverte" || conv.status === "apercu");
  $("thread").scrollTop = $("thread").scrollHeight;
}

function setComposer(open) {
  const off = !open || state.busy;
  $("text").disabled = off; $("send").disabled = off; $("photoBtn").disabled = off;
  $("text").placeholder = !open ? "Conversation terminée : ouvrez-en une nouvelle." : state.busy ? "L’assistant travaille…" : "Que voulez-vous changer sur le site ?";
}

async function openConv(id) {
  state.current = id;
  history.replaceState(null, "", `#${id}`);
  state.conv = await api(`conversations/${id}`);
  state.busy = !!state.conv.conversation.busy;
  render(); loadList();
  if (state.busy) follow(id);
  if (state.conv.conversation.status === "publiee") followDeploy(id);
}

async function ensureConv() {
  if (state.current && state.conv) return state.current;
  const { id } = await api("conversations", { method: "POST", body: JSON.stringify({}) });
  await openConv(id);
  return id;
}

// Suit l’assistant pendant qu’il travaille (il continue même si on ferme l’onglet).
async function follow(id) {
  if (state.polling) return;
  state.polling = true;
  const live = document.createElement("div"); live.className = "msg assistant"; live.innerHTML = '<span class="typing">L’assistant réfléchit…</span>';
  $("inner").append(live);
  const chips = document.createElement("div"); chips.style.display = "contents"; live.before(chips);
  try {
    while (state.current === id) {
      const r = await api(`conversations/${id}/live`);
      const l = r.live;
      chips.innerHTML = l.events.filter((e) => e.type === "tool" || (e.type === "tool_done" && !e.ok) || e.type === "error").map((e) => `<div class="chip ${e.type !== "tool" ? "err" : ""}">${esc(e.label || e.message)}</div>`).join("");
      if (l.text) live.innerHTML = rich(l.text);
      $("thread").scrollTop = $("thread").scrollHeight;
      if (!l.running && !r.conversation.busy) break;
      await sleep(1200);
    }
  } catch (err) { alertInline(err.message); }
  state.polling = false;
  if (state.current === id) { state.busy = false; await openConv(id); }
}

// Après publication : suit la mise en ligne jusqu’au bout.
async function followDeploy(id) {
  for (let i = 0; i < 60 && state.current === id; i++) {
    const r = await api(`conversations/${id}/status`).catch(() => null);
    const badge = $("deploy");
    if (!r || !badge) return;
    if (!r.deploy || r.deploy.status !== "completed") badge.textContent = "Mise en ligne en cours…";
    else if (r.deploy.conclusion === "success") { badge.innerHTML = `En ligne ✅ <a href="${esc(state.me.site)}" target="_blank" rel="noopener" style="color:#fff">voir le site</a>`; return; }
    else { badge.className = "badge b-busy"; badge.textContent = "⚠️ La mise en ligne a échoué : prévenez Michael"; return; }
    await sleep(5000);
  }
}

function resize(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Image illisible"))), "image/jpeg", quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("Image illisible"));
    img.src = URL.createObjectURL(file);
  });
}

$("photoBtn").onclick = () => $("photo").click();
$("photo").onchange = async (e) => {
  const files = [...e.target.files].slice(0, 6 - state.pending.length); e.target.value = "";
  try {
    const id = await ensureConv();
    for (const f of files) {
      const tag = document.createElement("span"); tag.textContent = `⏳ ${f.name}`; $("pending").append(tag);
      const { path } = await api(`conversations/${id}/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", body: await resize(f, 2000, 0.85), headers: { "Content-Type": "image/jpeg" } });
      state.pending.push(path);
      tag.textContent = `📷 ${f.name}`;
    }
  } catch (err) { alertInline(err.message); }
};

function alertInline(message) {
  const d = document.createElement("div"); d.className = "chip err"; d.textContent = message; $("inner").append(d);
  $("thread").scrollTop = $("thread").scrollHeight;
}

$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
$("text").addEventListener("input", () => { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 192) + "px"; });

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if ((!text && !state.pending.length) || state.busy) return;
  try {
    const id = await ensureConv();
    const photos = state.pending;
    await api(`conversations/${id}/messages`, { method: "POST", body: JSON.stringify({ text, photos }) });
    state.pending = []; $("pending").innerHTML = ""; $("text").value = ""; $("text").style.height = "auto";
    await openConv(id);
  } catch (err) { alertInline(err.message); }
};

async function publish() {
  const id = state.current; if (!id) return;
  for (const b of document.querySelectorAll("[data-publish]")) { b.disabled = true; b.textContent = "Mise en ligne…"; }
  try { await api(`conversations/${id}/publish`, { method: "POST" }); } catch (err) { /* la raison est ajoutée à la conversation */ }
  await openConv(id);
}
async function archive() {
  if (!state.current) return;
  try { await api(`conversations/${state.current}/archive`, { method: "POST" }); } catch (err) { alertInline(err.message); }
  await openConv(state.current);
}

$("new").onclick = () => { state.current = null; state.conv = null; state.pending = []; $("pending").innerHTML = ""; history.replaceState(null, "", location.pathname); document.body.classList.remove("side"); render(); loadList(); $("text").focus(); };
$("menu").onclick = () => document.body.classList.toggle("side");

(async () => {
  state.me = await api("me");
  Object.assign(NAMES, state.me.names || {});
  $("me").textContent = `Connecté·e : ${state.me.email}`;
  await loadList();
  const id = location.hash.slice(1);
  if (id) await openConv(id); else render();
  setInterval(() => { if (!state.polling) loadList().catch(() => {}); }, 15000);
})().catch((e) => alertInline(e.message));
</script>
</body>
</html>
