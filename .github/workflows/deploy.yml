# Construit le site à chaque modification.
# main → mise en ligne du site public (fichiers statiques) et de l'admin (Worker séparé). chat/* (une branche par conversation de l'admin) → aperçu sur une URL dédiée.
name: Construire et déployer

on:
  push:
    branches: [main, "chat/**"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Construire le site
        run: bun run build
      - name: Tests des garde-fous de l'admin
        run: bun test worker/

      - name: Mettre en ligne
        if: github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deploy
          bunx wrangler d1 migrations apply jardinsdici-admin --remote -c wrangler.admin.jsonc
          bunx wrangler deploy -c wrangler.admin.jsonc

      - name: Publier l'aperçu de la conversation
        if: startsWith(github.ref, 'refs/heads/chat/') && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ALIAS=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          bunx wrangler versions upload --preview-alias "$ALIAS" --message "Aperçu ${GITHUB_REF_NAME}"
